# Idioma da fala. Copie este arquivo e o .prompt ao lado para adicionar outro.
# O código de idioma é o que o motor de síntese recebe.
LANG_CODE=pt-br

# Frases que o sistema fala para anunciar a origem de uma leitura.
SAY_SELECTION=Texto selecionado
SAY_PASTED=Texto colado
SAY_CLIPBOARD=Texto copiado

# Frase de teste do instalador.
SAY_INSTALLED=Instalação concluída. Escolha uma voz no menu.

# Avisos curtos quando o Claude Code precisa de você.
# {PROJ} é trocado pelo nome ou legenda do projeto.
SAY_QUESTION={PROJ} fez uma pergunta
SAY_PERMISSION={PROJ} pede permissão
SAY_NEEDS_YOU={PROJ} precisa de você
SAY_FAILED={PROJ} parou com erro
