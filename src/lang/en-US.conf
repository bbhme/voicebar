# Example of a second language. To use it, put "en-US" in ~/.claude/voice/lang
# and add English voices to voices.txt.
LANG_CODE=en-us

SAY_SELECTION=Selected text
SAY_PASTED=Pasted text
SAY_CLIPBOARD=Copied text

SAY_INSTALLED=Installation complete. Pick a voice from the menu.

# Short alerts for when Claude Code needs you.
# {PROJ} is replaced by the project name or label.
SAY_QUESTION={PROJ} asked a question
SAY_PERMISSION={PROJ} needs permission
SAY_NEEDS_YOU={PROJ} needs you
SAY_FAILED={PROJ} stopped with an error
